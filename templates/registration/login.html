{% extends "base.html" %}

{% block title %}
ورود | Smart ASIGI Farm
{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-5">

            <div class="card border-0 shadow">

                <div class="card-body p-4">

                    <div class="text-center mb-4">

                        <h3 class="fw-bold">
                            🌱 Smart ASIGI Farm
                        </h3>

                        <p class="text-muted">
                            ورود به سامانه
                        </p>

                    </div>

                    {% if form.errors %}
                        <div class="alert alert-danger">
                            نام کاربری یا رمز عبور صحیح نیست.
                        </div>
                    {% endif %}

                    <form method="post">

                        {% csrf_token %}

                        <div class="mb-3">

                            <label class="form-label">
                                نام کاربری
                            </label>

                            <input
                                type="text"
                                name="username"
                                class="form-control"
                                required
                                autofocus
                            >

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                رمز عبور
                            </label>

                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                required
                            >

                        </div>


                        <input
                            type="hidden"
                            name="next"
                            value="{{ next }}"
                        >


                        <button
                            type="submit"
                            class="btn btn-success w-100"
                        >
                            ورود
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
