{% extends "base.html" %}

{% block title %}
نقشه مزارع | Smart ASIGI Farm
{% endblock %}


{% block footer %}
{% endblock %}


{% block extra_css %}

<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
>

<style>

    html,
    body {
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
    }

    .main-content {
        height: calc(100vh - 72px);
        min-height: 0;
        padding: 0 !important;
        margin: 0 !important;
    }

    .map-page {
        position: relative;
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
    }

    #map {
        position: absolute;
        inset: 0;

        width: 100%;
        height: 100%;

        z-index: 1;
    }

    .map-panel {
        position: absolute;

        top: 20px;
        right: 20px;

        z-index: 1000;

        width: 280px;

        background: rgba(255, 255, 255, 0.96);

        border-radius: 14px;

        padding: 18px;

        box-shadow:
            0 8px 30px rgba(0, 0, 0, 0.18);
    }

    .map-panel-title {
        font-size: 18px;
        font-weight: bold;
        margin-bottom: 8px;
        color: #198754;
    }

    .map-panel-text {
        font-size: 13px;
        color: #666;
        margin: 0;
    }

    .leaflet-control {
        font-family: Tahoma, Arial, sans-serif;
    }

</style>

{% endblock %}


{% block content %}

<div class="map-page">

    <div id="map"></div>


    <div class="map-panel">

        <div class="map-panel-title">
            <i class="bi bi-map"></i>
            نقشه مزارع
        </div>

        <p class="map-panel-text">
            نمایش موقعیت مزارع و نقاط مهم سامانه
            Smart ASIGI Farm
        </p>

    </div>

</div>

{% endblock %}


{% block extra_js %}

<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>

document.addEventListener("DOMContentLoaded", function () {

    const mapElement = document.getElementById("map");

    if (!mapElement) {
        console.error("Map container not found.");
        return;
    }


    const map = L.map("map", {
        center: [35.6892, 51.3890],
        zoom: 6,

        zoomControl: true,

        attributionControl: true
    });


    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            maxZoom: 19,

            attribution:
                '&copy; OpenStreetMap contributors'
        }
    ).addTo(map);


    const farmMarker = L.marker([
        35.6892,
        51.3890
    ]).addTo(map);


    farmMarker.bindPopup(`
        <div dir="rtl" style="text-align:right">
            <strong>Smart ASIGI Farm</strong>
            <br>
            موقعیت نمونه مزرعه
        </div>
    `);


    setTimeout(function () {

        map.invalidateSize();

    }, 300);

});

</script>

{% endblock %}
