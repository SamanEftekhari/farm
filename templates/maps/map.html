{% extends "base.html" %}
{% load static %}

{% block title %}
ASIGI FARM | GIS
{% endblock %}


{% block extra_css %}

<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css"
/>

<style>

html,
body{

    height:100%;
    margin:0;
    padding:0;

}

#map{

    width:100%;
    height:100vh;

}

.leaflet-control{

    font-family:Vazirmatn,sans-serif;

}

</style>

{% endblock %}


{% block content %}

<div id="map"></div>

{% endblock %}


{% block extra_js %}

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>

<script>

/*=====================================
    ASIGI FARM GIS
======================================*/

// ایجاد نقشه

const map = L.map("map").setView([35.6892,51.3890],6);


// لایه OpenStreetMap

const osm = L.tileLayer(

    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

    {

        maxZoom:20,

        attribution:"© OpenStreetMap"

    }

);

osm.addTo(map);


// مارکر اولیه

L.marker([35.6892,51.3890])

.addTo(map)

.bindPopup("<b>ASIGI FARM</b><br>Smart Agriculture Platform")

.openPopup();


//============================
// لایه اشیای رسم شده
//============================

const drawnItems = new L.FeatureGroup();

map.addLayer(drawnItems);


//============================
// ابزار رسم
//============================

const drawControl = new L.Control.Draw({

    position:"topleft",

    draw:{

        polyline:false,

        circle:false,

        circlemarker:false,

        rectangle:true,

        polygon:true,

        marker:true

    },

    edit:{

        featureGroup:drawnItems,

        remove:true

    }

});

map.addControl(drawControl);


//============================
// بعد از رسم
//============================

map.on(L.Draw.Event.CREATED,function(e){

    const layer = e.layer;

    drawnItems.addLayer(layer);

    console.log(layer.toGeoJSON());

});


//============================
// نمایش مختصات با کلیک
//============================

map.on("click",function(e){

    console.log(

        "Lat:",e.latlng.lat,

        "Lng:",e.latlng.lng

    );

});


//============================
// کنترل لایه ها
//============================

const baseMaps={

    "OpenStreetMap":osm

};

const overlayMaps={

    "GIS Layers":drawnItems

};

L.control.layers(

    baseMaps,

    overlayMaps

).addTo(map);

</script>

{% endblock %}
