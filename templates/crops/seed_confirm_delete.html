{% extends "base.html" %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow-sm border-0">

                <div class="card-body text-center p-5">

                    <i class="bi bi-exclamation-triangle text-danger display-4"></i>

                    <h4 class="mt-3">
                        حذف بذر
                    </h4>

                    <p class="text-muted">
                        آیا از حذف بذر با شماره بچ
                        <strong>{{ seed.lot_number }}</strong>
                        مطمئن هستید؟
                    </p>

                    <form method="post">

                        {% csrf_token %}

                        <button
                            type="submit"
                            class="btn btn-danger"
                        >
                            <i class="bi bi-trash"></i>
                            بله، حذف شود
                        </button>

                        <a
                            href="{% url 'crops:seed_detail' seed.pk %}"
                            class="btn btn-secondary"
                        >
                            انصراف
                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
