{% extends "base.html" %}

{% block title %}
حذف محصول | Smart ASIGI Farm
{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card border-0 shadow-sm">

                <div class="card-body text-center p-5">

                    <i
                        class="bi bi-exclamation-triangle text-danger"
                        style="font-size: 50px;"
                    ></i>

                    <h4 class="mt-3">
                        حذف محصول
                    </h4>

                    <p class="text-muted">
                        آیا از حذف
                        <strong>{{ crop.name }}</strong>
                        مطمئن هستید؟
                    </p>


                    <form method="post">

                        {% csrf_token %}

                        <button
                            type="submit"
                            class="btn btn-danger"
                        >
                            بله، حذف شود
                        </button>

                        <a
                            href="{% url 'crops:crop_list' %}"
                            class="btn btn-secondary"
                        >
                            انصراف
                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
