{% extends "base.html" %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card border-0 shadow-sm">

                <div class="card-body text-center p-5">

                    <i class="bi bi-exclamation-triangle text-danger display-4"></i>

                    <h4 class="mt-3">
                        حذف رقم محصول
                    </h4>

                    <p class="text-muted">

                        آیا از حذف رقم

                        <strong>
                            {{ variety.name }}
                        </strong>

                        مربوط به محصول

                        <strong>
                            {{ variety.crop.name }}
                        </strong>

                        مطمئن هستید؟

                    </p>


                    <form method="post">

                        {% csrf_token %}

                        <button
                            type="submit"
                            class="btn btn-danger"
                        >

                            <i class="bi bi-trash"></i>

                            بله، حذف شود

                        </button>


                        <a
                            href="{% url 'crops:crop_variety_detail' variety.pk %}"
                            class="btn btn-secondary"
                        >
                            انصراف
                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
